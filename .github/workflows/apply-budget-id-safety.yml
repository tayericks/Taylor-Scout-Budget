name: Apply budget id safety
on:
  push:
    paths:
      - '.github/workflows/apply-budget-id-safety.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch duplicate location id safety
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/supabase.ts')
          s=p.read_text()
          old="  const presentLocations=new Set<string>();const known=loadedBudgetIds.get(showId)||new Map<string,string>();const tombstonesAtLoad=loadedBudgetTombstones.get(showId)||new Set<string>()\n  for(const budget of budgets){\n    const locationId=await ensureLocationId(showId,budget);presentLocations.add(locationId);"
          new="  const presentLocations=new Set<string>();const known=loadedBudgetIds.get(showId)||new Map<string,string>();const tombstonesAtLoad=loadedBudgetTombstones.get(showId)||new Set<string>();const seenLocationIds=new Map<string,string>()\n  for(const budget of budgets){\n    if(budget.sharedLocationId){const priorBudgetId=seenLocationIds.get(budget.sharedLocationId);if(priorBudgetId&&priorBudgetId!==budget.id){budget.sharedLocationId=undefined}}\n    const locationId=await ensureLocationId(showId,budget);seenLocationIds.set(locationId,budget.id);presentLocations.add(locationId);"
          if old not in s:
              raise SystemExit('save loop target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit safety fix
        run: |
          git config user.name "Taylor Scout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/supabase.ts
          git commit -m "Prevent multiple budgets sharing one location save key [skip ci]"
          git push
