name: Apply print hotfix
on:
  push:
    paths:
      - '.github/workflows/apply-print-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch print flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          old="const printBudget = () => { setPrintBudgetIds([budget.id]); saveNow(); window.setTimeout(() => window.print(), 80) }\n  const printSelectedBudgets = (ids:string[]) => { setPrintBudgetIds(ids); saveNow(); setActiveModal(null); window.setTimeout(() => window.print(), 120) }"
          new="const printBudget = () => { setPrintBudgetIds([budget.id]); void saveNow(); window.requestAnimationFrame(() => window.requestAnimationFrame(() => window.print())) }\n  const printSelectedBudgets = (ids:string[]) => { setPrintBudgetIds(ids); void saveNow(); setActiveModal(null); window.requestAnimationFrame(() => window.requestAnimationFrame(() => window.print())) }"
          if old not in s:
              raise SystemExit('print function target not found')
          s=s.replace(old,new,1)
          old2="onClick={()=>{setPrintOrientation('landscape');setPrintMenuOpen(false);window.setTimeout(printBudget,80)}}"
          new2="onClick={()=>{setPrintOrientation('landscape');setPrintMenuOpen(false);printBudget()}}"
          if old2 not in s:
              raise SystemExit('landscape print target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "Taylor Scout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.tsx
          git commit -m "Fix Budget print action [skip ci]"
          git push
